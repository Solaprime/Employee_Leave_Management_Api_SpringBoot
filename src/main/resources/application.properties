spring.application.name=leave-management

# In-memory H2; LOCK_TIMEOUT lets a waiting SELECT ... FOR UPDATE block instead of failing fast
spring.datasource.url=jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
